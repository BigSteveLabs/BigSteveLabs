    <text x="524" y="87" fill="#36A3FF" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="5">LABS</text>
    <rect x="2" y="117" width="708" height="4" rx="2" fill="#0A84FF"/>
    <text x="4" y="174" fill="#9BA9BA" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="7">BUILD • AUTOMATE • INNOVATE</text>
