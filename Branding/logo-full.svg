<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BigSteve Labs full logo</title>
  <desc id="desc">Electric blue BS monogram with BigSteve Labs wordmark and Build Automate Innovate tagline on a deep navy background.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36A3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="36" fill="url(#panel)"/>
  <path d="M36 280H1164" stroke="#0B1F3A" stroke-width="2"/>
  <g transform="translate(74 62)">
    <rect x="0" y="0" width="236" height="236" rx="48" fill="#071426" stroke="#0A84FF" stroke-width="8"/>
    <path d="M24 118H212M118 24V212" stroke="#0B1F3A" stroke-width="2"/>
