<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 576" role="img" aria-labelledby="title desc">
  <title id="title">BigSteve Labs GitHub banner</title>
  <desc id="desc">Wide dark technology banner for BigSteve Labs with mission statement and project categories.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.58" stop-color="#071426"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36A3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#36A3FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="2048" height="576" fill="url(#background)"/>
  <rect width="2048" height="576" fill="url(#grid)"/>
  <circle cx="1840" cy="84" r="330" fill="#0A84FF" opacity="0.06"/>
  <circle cx="1904" cy="488" r="220" fill="#36A3FF" opacity="0.05"/>
  <path d="M0 520H2048" stroke="#0A84FF" stroke-width="6"/>
  <g transform="translate(112 108)">
    <rect width="360" height="360" rx="76" fill="#071426" stroke="url(#accent)" stroke-width="12"/>
    <path d="M48 180H312M180 48V312" stroke="#0B1F3A" stroke-width="4"/>
    <path d="M48 100H80M280 100H312M48 260H80M280 260H312" stroke="#36A3FF" stroke-width="10" stroke-linecap="round"/>
    <text x="180" y="224" text-anchor="middle" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="158" font-weight="800" letter-spacing="-12">BS</text>
  </g>
  <g transform="translate(548 126)">
    <text x="0" y="104" fill="#E8EEF7" font-family="Segoe UI, Arial, sans-serif" font-size="106" font-weight="800" letter-spacing="5">BIGSTEVE LABS</text>
    <rect x="2" y="138" width="1078" height="6" rx="3" fill="#0A84FF"/>
    <text x="2" y="215" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="500">Building practical AI tools that solve real-world problems.</text>
    <text x="4" y="300" fill="#9BA9BA" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="4">AI ASSISTANTS • AUTOMATION • EXPERIMENTS • OPEN SOURCE</text>
    <text x="4" y="354" fill="#36A3FF" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="8">BUILD • AUTOMATE • INNOVATE</text>
